name: PPC To-Do CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/todo-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_test_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ppc-todo-ci .

      - name: Run CI/CD Pipeline
        run: |
          docker run --rm \
            -e GITHUB_ACTOR \
            -v "$GITHUB_WORKSPACE:/app" \
            ppc-todo-ci

      - name: Verify HTML
        run: |
          test -f index.html
          grep "Automated Test Status: Passed" index.html
          echo "HTML verification successful."

      - name: Commit Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          if ! git diff --cached --quiet; then
            git commit -m "CI/CD: update test results"
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "No changes to commit."
          fi