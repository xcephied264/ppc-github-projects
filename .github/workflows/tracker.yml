name: PPC Issue Tracker

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  track_issues:
    runs-on: ubuntu-latest

    steps:
      - name: Track Inactive Issues
        uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: 'inactive'
          stale-issue-message: 'This issue has been inactive for 30 days. Please update its status if work is ongoing.'